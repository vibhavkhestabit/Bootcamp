services:
  backend:
    build: ./backend
    networks:
      - day4-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro 
    depends_on:
      - backend
    networks:
      - day4-network

networks:
  day4-network:
    driver: bridge