services:
  # 1. The Database (MongoDB)
  mongo:
    image: mongo:latest
    container_name: sneaker_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. The Backend API (Node.js)
  backend:
    build: ./backend
    container_name: sneaker_backend
    restart: always
    environment:
      - MONGO_URL=mongodb://mongo:27017/sneaker-hub
      - PORT=3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/products"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 3. The Frontend UI (Node.js HTTP Server)
  frontend:
    build: ./frontend
    container_name: sneaker_frontend
    restart: always
    volumes:
      - ./frontend:/app
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. The Gateway (Public NGINX)
  gateway:
    image: nginx:latest
    container_name: sneaker_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_net:
    driver: bridge

volumes:
  mongo_data: