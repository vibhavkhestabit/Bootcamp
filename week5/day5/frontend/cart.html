<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart - Sneaker Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
    <header class="header">
        <h1>Sneaker <span>Hub</span></h1>
    </header>

    <nav class="menu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Buy Sneakers</a></li>
            <li><a href="sell.html">Sell Sneaker</a></li>
            <li><a href="cart.html" class="active">Cart</a></li>
        </ul>
    </nav>

<main class="main" style="grid-column: 1 / -1;">
        <h2 style="text-align: center; margin-bottom: 20px;">Your Shopping Cart</h2>
        
        <div class="sidebar-card" style="max-width: 600px; margin: 0 auto;">
            <ul id="cart-items" style="list-style: none; padding: 0;"></ul>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            
            <div style="display: flex; justify-content: space-between; font-size: 1.2em; font-weight: bold;">
                <span>Total:</span>
                <span id="cart-total">₹0</span>
            </div>

            <button class="cta" style="width: 100%; margin-top: 20px;" onclick="checkout()">Proceed to Checkout</button>
            <button class="cta secondary" style="width: 100%; margin-top: 10px; color: #333; border-color: #ddd;" onclick="clearCart()">Clear Cart</button>

            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px dashed #ccc; text-align: center; font-size: 0.9em; color: #555;">
                <p><strong>Vibhav Khaneja</strong></p>
                <p>Trainee Software Engineer</p>
                <p>📞 8130907023</p>
            </div>
        </div>
    </main>
</div>

<script>
    function loadCart() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const list = document.getElementById('cart-items');
        let total = 0;

        list.innerHTML = '';
        if (cart.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#777;">Your cart is empty.</p>';
        }

        cart.forEach((item) => {
            total += item.price;
            // Now rendering the Image!
            list.innerHTML += `
                <li style="display: flex; align-items: center; gap: 15px; padding: 10px 0; border-bottom: 1px solid #f4f4f9;">
                    <img src="${item.image}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd;">
                    <div style="flex: 1;">
                        <span style="display: block; font-weight: 600;">${item.name}</span>
                        <small style="color: #888;">Size: UK 9</small>
                    </div>
                    <span style="font-weight: bold;">₹${item.price}</span>
                </li>
            `;
        });

        document.getElementById('cart-total').textContent = '₹' + total;
    }

    function checkout() { alert("Redirecting to Payment Gateway..."); }

    function clearCart() {
        localStorage.removeItem('cart');
        loadCart();
        alert("Cart Cleared!");
    }

    loadCart();
</script>
</body>
</html>
